<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Global Chat</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f5f7;
    }

    header {
      background: #087f5b;
      color: white;
      padding: 18px;
      font-size: 24px;
      font-weight: bold;
      text-align: center;
    }

    .container {
      padding: 20px;
      max-width: 600px;
      margin: auto;
    }

    .welcome {
      background: white;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
      text-align: center;
    }

    .welcome h2 {
      margin-top: 0;
      color: #087f5b;
    }

    #messages {
      background: white;
      min-height: 350px;
      max-height: 450px;
      overflow-y: auto;
      padding: 15px;
      border-radius: 15px;
      margin-bottom: 15px;
    }

    .message {
      background: #e8f5e9;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 10px;
    }

    .message strong {
      color: #087f5b;
    }

    .input-area {
      display: flex;
      gap: 8px;
    }

    #messageInput {
      flex: 1;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      background: #087f5b;
      color: white;
      border: none;
      padding: 14px 20px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
    }

    button:active {
      transform: scale(0.97);
    }

    .info {
      text-align: center;
      color: #666;
      margin-top: 15px;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <header>
    🌍 Global Chat
  </header>

  <div class="container">

    <div class="welcome">
      <h2>Welcome to Global Chat</h2>
      <p>Connect and chat with people around the world 🌎</p>
    </div>

    <div id="messages">
      <div class="message">
        <strong>Global Chat:</strong><br>
        Welcome! Your chat is ready. 🎉
      </div>
    </div>

    <div class="input-area">
      <input
        type="text"
        id="messageInput"
        placeholder="Type a message..."
      >

      <button onclick="sendMessage()">
        Send
      </button>
    </div>

    <div class="info">
      Global Chat — connecting people around the world
    </div>

  </div>

  <script>
    function sendMessage() {
      const input = document.getElementById("messageInput");
      const messages = document.getElementById("messages");

      const text = input.value.trim();

      if (text === "") {
        return;
      }

      const message = document.createElement("div");
      message.className = "message";

      message.innerHTML =
        "<strong>You:</strong><br>" + text;

      messages.appendChild(message);

      input.value = "";

      messages.scrollTop = messages.scrollHeight;
    }

    document
      .getElementById("messageInput")
      .addEventListener("keypress", function(event) {

        if (event.key === "Enter") {
          sendMessage();
        }

      });
  </script>

</body>
</html>
